[project]
name = "comfyui-resolution-tools"
description = "Resolution maths for latent-space models. Real megapixels (10^6, not 1024^2), patch-grid alignment for Krea 2 / MiniMax H3 / P-H3 Image / Flux / SDXL, exact-ratio sizing, and explicit P-H3 recommended image presets."
version = "1.4.0"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
# Pure stdlib maths; everything else is provided by ComfyUI core.
dependencies = []

[project.urls]
Repository = "https://github.com/dreevelle/ComfyUI-ResolutionTools"

[tool.comfy]
PublisherId = "dreevelle"
DisplayName = "ComfyUI-ResolutionTools"
Icon = "https://raw.githubusercontent.com/dreevelle/ComfyUI-ResolutionTools/main/assets/icon.png"
